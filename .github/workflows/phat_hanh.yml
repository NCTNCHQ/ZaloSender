# Tự tạo GitHub Release khi đẩy tag v<số> (vd v1.11).
# Thư mục phat_hanh/<tag>/ phải có: ZaloSender_<tag>.zip và phien_ban.json (đã ký số bằng khóa bí mật của tác giả).
name: Phat hanh ban moi
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tao Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="phat_hanh/${TAG}"
          test -f "${DIR}/phien_ban.json" || { echo "Thiếu ${DIR}/phien_ban.json"; exit 1; }
          test -f "${DIR}/ZaloSender_${TAG}.zip" || { echo "Thiếu ${DIR}/ZaloSender_${TAG}.zip"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('${DIR}/phien_ban.json',encoding='utf-8'))['data']; open('notes.md','w',encoding='utf-8').write(d['notes']); sys.exit(0 if 'v'+d['version']=='${TAG}' else 'Sai phiên bản trong phien_ban.json')"
          gh release create "${TAG}" "${DIR}/ZaloSender_${TAG}.zip" "${DIR}/phien_ban.json" \
            --title "${TAG}" --notes-file notes.md --latest
